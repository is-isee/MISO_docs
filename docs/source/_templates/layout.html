{% extends "!layout.html" %}

{#- 日本語版は /MISO_docs/、英語版は /MISO_docs/en/ にある。同じページの他方の言語へリンクする。 #}
{% block content %}
<div id="language-links" style="margin-bottom: 1em; font-size: 100%;">
    Language:
    {% if language == "en" %}
    <strong>English</strong> |
    <a href="{{ content_root }}../{{ pagename }}{{ file_suffix }}">日本語</a>
    {% else %}
    <a href="{{ content_root }}en/{{ pagename }}{{ file_suffix }}">English</a> |
    <strong>日本語</strong>
    {% endif %}
</div>

{{ super() }}
{% endblock %}
